# Test coverage workflow.
#
# Runs covr on pushes to and pull requests against main, then:
#   * publishes the coverage badge and Cobertura XML to the orphan
#     `_xml_coverage_reports` branch via insightsengineering/coverage-action
#     (this is the source of the "Code Coverage" badge in README.md), and
#   * deploys the HTML coverage report to the pkgdown site under
#     `latest-tag/coverage-report/` (the badge's link target).
#
# The covr steps are derived from
# https://github.com/r-lib/actions/tree/v2/examples ; the badge/report
# publishing follows the openpharma coverage convention.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: test-coverage

# Serialize gh-pages writes with the pkgdown workflow (which shares this group)
# so the two deploy actions never push the gh-pages branch concurrently.
concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::DT, any::htmltools, any::xml2

      - name: Run coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "coverage.xml")
          covr::report(cov, file = "coverage-report.html", browse = FALSE)
          # Percentage for the badge, rounded to 2 decimals. coverage-action
          # renders its own badge to 8 decimals with no rounding option, so we
          # regenerate the badge below from this value.
          writeLines(
            formatC(covr::percent_coverage(cov), format = "f", digits = 2),
            "coverage-percent.txt"
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Publish coverage badge and XML to _xml_coverage_reports
        # Runs on push to main and on same-repo PRs. Skipped for fork PRs,
        # whose GITHUB_TOKEN is read-only and cannot push the storage branch
        # or post the PR comment (both would 403 and fail the job).
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: insightsengineering/coverage-action@v3
        with:
          path: ./coverage.xml
          threshold: 0
          fail: false
          publish: true
          diff: true
          diff-branch: main
          coverage-summary-title: "Code Coverage Summary"

      # coverage-action bakes an 8-decimal percentage into badge.svg (its
      # `Get total` step uses `printf "%.8f"`, with no rounding input, in every
      # released version). Regenerate the badge from the 2-decimal value using
      # the same generator (emibcn/badge-action) so the SVG geometry matches
      # the shorter text, then overwrite the badge the action just pushed.
      - name: Compute rounded coverage and badge color
        id: badge
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          pct="$(cat coverage-percent.txt)"
          # Same color tiers as insightsengineering/coverage-action.
          color="$(awk -v p="$pct" 'BEGIN{
            if (p>90) print "green";
            else if (p>80) print "yellow,green";
            else if (p>70) print "yellow";
            else if (p>60) print "orange,yellow";
            else if (p>50) print "orange";
            else if (p>40) print "red,orange";
            else if (p>30) print "red,red,orange";
            else if (p>20) print "red,red,red,orange";
            else print "red";
          }')"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Generate rounded badge SVG
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: emibcn/badge-action@808173dd03e2f30c980d03ee49e181626088eee8 # v2.0.3
        with:
          label: "Test Coverage"
          status: "${{ steps.badge.outputs.pct }}%"
          color: ${{ steps.badge.outputs.color }}
          path: rounded-badge.svg

      - name: Publish rounded badge to _xml_coverage_reports
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          tmp="$(mktemp -d)"
          git clone --quiet --depth 1 --branch _xml_coverage_reports \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$tmp/cov"
          install -D rounded-badge.svg "$tmp/cov/data/${branch}/badge.svg"
          cd "$tmp/cov"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Badge already rounded; nothing to push."
          else
            git commit --quiet -am "Round Test Coverage badge to 2 decimal places"
            # Retry once on top of a concurrent update to the storage branch.
            git push origin _xml_coverage_reports || {
              git pull --rebase origin _xml_coverage_reports
              git push origin _xml_coverage_reports
            }
          fi
        shell: bash

      - name: Stage HTML report for deployment
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p coverage-report-site
          mv coverage-report.html coverage-report-site/index.html
          # covr::report() -> htmltools::save_html() emits a sibling `lib/`
          # directory (jQuery, DataTables, Bootstrap, ...) that index.html
          # references with relative paths. It must ship alongside the report,
          # or the deployed page renders unstyled and non-interactive.
          if [ -d lib ]; then
            mv lib coverage-report-site/lib
          else
            echo "::error::Expected covr report asset directory 'lib/' was not found"
            exit 1
          fi
        shell: bash

      - name: Deploy HTML coverage report to gh-pages (latest-tag)
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: coverage-report-site
          target-folder: latest-tag/coverage-report
